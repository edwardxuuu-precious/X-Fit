name: FitnessApp

options:
  bundleIdPrefix: com.edward
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 43
    MARKETING_VERSION: 0.5.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 664DT5VC99

targets:
  FitnessApp:
    type: application
    platform: iOS
    sources:
      - path: FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edward.FitnessApp
        PRODUCT_NAME: FitnessApp
        CODE_SIGN_ENTITLEMENTS: FitnessApp/FitnessApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        X_FIT_CLOUD_SYNC_ENABLED: NO
        EQUIPMENT_RECOGNITION_ENDPOINT: ""
        WELLNESS_AGENT_ENDPOINT: ""
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FitnessApp/Info.plist
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: XFitShareExtension
    scheme:
      testTargets:
        - FitnessAppTests
        - FitnessAppUITests

  XFitShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: XFitShareExtension
      - path: FitnessApp/Shared/ExerciseShareDraft.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edward.FitnessApp.XFitShareExtension
        PRODUCT_NAME: XFitShareExtension
        CODE_SIGN_ENTITLEMENTS: XFitShareExtension/XFitShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: XFitShareExtension/Info.plist
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: 1

  FitnessAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitnessAppTests
    dependencies:
      - target: FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edward.FitnessAppTests
        GENERATE_INFOPLIST_FILE: YES

  FitnessAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitnessAppUITests
    dependencies:
      - target: FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edward.FitnessAppUITests
        GENERATE_INFOPLIST_FILE: YES
