name: FitnessApp

options:
  bundleIdPrefix: com.edward
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 0.3.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 664DT5VC99

targets:
  FitnessApp:
    type: application
    platform: iOS
    sources:
      - path: FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edward.FitnessApp
        PRODUCT_NAME: FitnessApp
        CODE_SIGN_ENTITLEMENTS: FitnessApp/FitnessApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: X-Fit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSHealthShareUsageDescription: X-Fit 仅在你授权后读取体重和体脂，用于展示身体趋势。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: X-Fit 仅在你授权后把已完成的力量训练写入 Apple 健康。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: 1
    scheme:
      testTargets:
        - FitnessAppTests
        - FitnessAppUITests

  FitnessAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitnessAppTests
    dependencies:
      - target: FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edward.FitnessAppTests
        GENERATE_INFOPLIST_FILE: YES

  FitnessAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitnessAppUITests
    dependencies:
      - target: FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edward.FitnessAppUITests
        GENERATE_INFOPLIST_FILE: YES
