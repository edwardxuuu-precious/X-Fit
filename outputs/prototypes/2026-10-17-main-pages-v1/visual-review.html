<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X-Fit · A 原生视觉修订</title>
<style>
:root{--paper:#f7f7f0;--ink:#1c231b;--muted:#737e6e;--line:#ced5c8;--lime:#d3f75a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:#e8ebe4}*{box-sizing:border-box}body{margin:0}button,a{font:inherit;color:inherit}button{cursor:pointer}header{height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:900;letter-spacing:-1.6px;display:flex;align-items:center;gap:20px}.brand small{font-size:10px;font-weight:500;letter-spacing:1.6px;border-left:1px solid #acb7a4;padding-left:20px}header a{font-size:11px;text-decoration:none;color:var(--muted);border-bottom:1px solid #aeb9a6;padding-bottom:3px}.intro{display:flex;justify-content:space-between;align-items:end;gap:22px;margin:30px 4vw 26px}.intro p{margin:0 0 10px;font-size:10px;color:var(--muted);letter-spacing:2px}.intro h1{font-size:28px;letter-spacing:-1.1px;line-height:1.3;margin:0;font-weight:650}.controls{display:flex;align-items:center;gap:4px;background:#dce1d5;padding:4px;border-radius:30px}.controls button{font-size:12px;padding:9px 17px;background:none;border:0;border-radius:25px;color:var(--muted);min-height:38px}.controls button.active{background:var(--ink);color:var(--paper)}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin:0 4vw 24px;align-items:start}.phone-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:0 4px 10px}.phone-label b{font-size:12px;font-weight:500;color:var(--ink)}.phone{aspect-ratio:1206/2622;border-radius:29px;overflow:hidden;border:1px solid #b8c2b1;box-shadow:0 8px 25px #1927140c;background:var(--paper)}.phone img{width:100%;height:100%;display:block;object-fit:contain}.compare{display:none}.is-compare .board{display:none}.is-compare .compare{display:block}.page-tabs{display:flex;justify-content:center;gap:5px;margin:2px 0 23px}.page-tabs button{font-size:12px;background:none;border:1px solid var(--line);border-radius:20px;padding:8px 18px;min-height:38px}.page-tabs button.active{background:var(--lime);border-color:var(--lime)}.compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,345px));justify-content:center;gap:32px;margin:0 24px 24px}.compare-label{font-size:11px;color:var(--muted);margin:0 3px 11px;display:flex;justify-content:space-between}.compare-label b{font-weight:550;color:var(--ink)}.note{margin:26px 4vw 32px;display:flex;gap:22px;align-items:start;border-top:1px solid var(--line);padding-top:16px;font-size:11px;line-height:1.8;color:var(--muted)}.note b{font-weight:550;color:var(--ink);white-space:nowrap}.note span{max-width:920px}.is-before .after-image{display:none}.is-before .before-image{display:block}.before-image{display:none}.mode-status{display:inline-flex;gap:6px;align-items:center}.mode-status i{width:5px;height:5px;background:#6c8861;border-radius:5px}button:focus-visible,a:focus-visible{outline:3px solid #607e58;outline-offset:3px}@media(min-width:1600px){.board{max-width:1490px;margin-left:auto;margin-right:auto;gap:28px}.intro,.note{max-width:1490px;margin-left:auto;margin-right:auto}}@media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr));max-width:740px;margin-left:auto;margin-right:auto;gap:25px}.intro h1{font-size:23px}.intro{align-items:center}}@media(max-width:600px){header{height:65px;padding:0 20px}.brand{font-size:22px;gap:13px}.brand small{font-size:8px;padding-left:13px}header a{display:none}.intro{margin:24px 20px 22px;display:block}.intro h1{font-size:25px}.controls{margin-top:20px;display:inline-flex}.controls button{padding:8px 13px;font-size:11px}.board{margin:0 20px;grid-template-columns:1fr;gap:24px}.phone{max-width:402px;margin:auto}.note{margin:24px 20px;display:block}.note b{display:block;margin-bottom:7px}.compare-grid{gap:12px;margin:0 12px}.compare-grid .phone{border-radius:17px}.compare-label{font-size:9px}.page-tabs{gap:3px}.page-tabs button{padding:7px 13px;font-size:11px}}
</style></head><body>
<header><div class="brand">X—FIT<small>NATIVE / A REFINEMENT</small></div><a href="index.html?variant=A&view=overview">查看原来选定的 A V3 ↗</a></header>
<section class="intro"><div><p>VISUAL REVIEW / 原生页面</p><h1>收紧比例，找回运动感。</h1></div><div class="controls" aria-label="比较方式"><button data-mode="after" class="active">本次修订</button><button data-mode="compare">并排对照</button><button data-mode="before">修改前</button></div></section>
<main class="board" id="board"></main>
<section class="compare"><nav class="page-tabs" aria-label="选择对照页面"></nav><div class="compare-grid" id="compare-grid"></div></section>
<footer class="note"><b class="mode-status"><i></i>模拟器原生截图</b><span>均为本地隔离数据，未更新手机。修改前后使用同一设备尺寸；示例日期与记录状态可能不同，比较仅用于页面视觉。训练数据、完整确认与历史保留规则沿用已确认版本。</span></footer>
<script>
const pages=[['训练','01-training.png'],['饮食','02-nutrition.png'],['进展','03-progress.png'],['我的','04-profile.png']];let mode=new URLSearchParams(location.search).get('mode')||'after',index=Number(new URLSearchParams(location.search).get('page')||0);if(!['after','before','compare'].includes(mode))mode='after';if(index<0||index>3)index=0;
function phone(src,alt){return `<div class="phone"><img src="${src}" alt="${alt}" loading="eager"></div>`}
function render(){document.body.className=mode==='compare'?'is-compare':mode==='before'?'is-before':'';document.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('active',x.dataset.mode===mode);x.setAttribute('aria-pressed',String(x.dataset.mode===mode))});document.querySelector('#board').innerHTML=pages.map(([title,file],i)=>`<article><div class="phone-label"><b>${title}</b><span>0${i+1} / ${mode==='before'?'修改前':'本次修订'}</span></div>${phone((mode==='before'?'native-before/':'native-refined/')+file,title+'原生截图')}</article>`).join('');document.querySelector('.page-tabs').innerHTML=pages.map(([title],i)=>`<button data-page="${i}" class="${index===i?'active':''}" aria-pressed="${index===i}">${title}</button>`).join('');const [title,file]=pages[index];document.querySelector('#compare-grid').innerHTML=`<article><div class="compare-label"><b>修改前</b><span>${title}</span></div>${phone('native-before/'+file,title+'修改前')}</article><article><div class="compare-label"><b>本次修订</b><span>${title}</span></div>${phone('native-refined/'+(index===0?'00-training-today.png':file),title+'本次修订')}</article>`;const u=new URL(location.href);u.searchParams.set('mode',mode);u.searchParams.set('page',String(index));history.replaceState(null,'',u)}
document.addEventListener('click',ev=>{const m=ev.target.closest('[data-mode]');if(m){mode=m.dataset.mode;render()}const p=ev.target.closest('[data-page]');if(p){index=Number(p.dataset.page);render()}});render();
</script></body></html>
