<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">X-Fit Strength Trajectory app icon</title>
  <desc id="desc">Two minimal crossed barbells form a bold X, with the rising stroke passing over the descending stroke.</desc>
  <rect width="1024" height="1024" fill="#050708"/>

  <!-- The descending barbell is separated at the center so the rising stroke reads first. -->
  <g fill="#9EE805" transform="rotate(45 512 512)">
    <rect x="120" y="468" width="328" height="88" rx="44"/>
    <rect x="88" y="420" width="112" height="184" rx="28"/>
    <rect x="576" y="468" width="328" height="88" rx="44"/>
    <rect x="824" y="420" width="112" height="184" rx="28"/>
  </g>

  <!-- The uninterrupted lower-left to upper-right barbell is the progress trajectory. -->
  <g fill="#9EE805" transform="rotate(-45 512 512)">
    <rect x="140" y="460" width="744" height="104" rx="52"/>
    <rect x="88" y="414" width="112" height="196" rx="28"/>
    <rect x="824" y="414" width="112" height="196" rx="28"/>
  </g>
</svg>
